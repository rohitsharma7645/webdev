<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <form>
            <label for="username">Enter Your Id</label>
            <input type="text" id="username" placeholder="Enter your username">
            <br>
            <br>
            <label for="password">Enter Password</label>
            <input type="password" id="password" placeholder="Enter Your Password">
            <Div>
                Languages:
                <br>
                <input type="checkbox" id="Hindi">
                <label for="Hindi">Hindi</label>
                <br>
                <input type="checkbox" id="eng">
                <label for="eng">English</label>
            </Div>
            <div>
                <label for="favclr">Favorite color</label>
                <input type="color" id="favclr">
            </div>
            <br>
            <div>
                <label for="Date">DOB</label>
                <input type="date" min="2000-04-26" max="2007-03-25" id="Date">
                <br><br>
            </div>
            <div>
                <label for="email">Enter Your email id</label>
                <input type="email" id="email">
            </div>
            <div>
                <label for="bdaymonth">Enter Your Birthday Month</label>
                <input type="month" id="bdaymonth">
            </div>
            <div>
                <label for="age">Age</label>
                <input type="number" min="18" max="30">
            </div>
            <br>
            <div>
                <label for="selectfile">Upload:</label>
                <input type="file" id="selectfile">
            </div>
            <div>
                <input type="image" src="image1.jpg" alt="submit" height="30px" width="50px">
            </div>
        </form>
    </fieldset>
</body>
</html>
