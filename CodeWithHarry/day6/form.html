<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend>We are creating a form</legend>
    <form >
        <div>
            <label for="name">Enter Your Name:</label>
            <input type="text" id="name" placeholder="Enter Your Name ">
        </div>
        <br>
        <div>
            <label for="age">Enter Your Age:</label>
            <input type="number" id="age" placeholder="Enter Your Age">
        </div>
        <div>
            <p>Gender</p>
            <input type="radio" id="male" name="gender" >
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender">
            <label for="female">Female</label>
            <input type="radio" id="others" name="gender" >
            <label for="others">Others</label>
        </div>
        <br>
        <div>
            <label for="DOB">Enter Your Birth:</label>
            <input type="date">
        </div>
        <br>
        <div>
            <div>
                <label for="religion">Religion:</label>
                <select name="Relegion" id="religion">
                <option value="Hinduism">Hinduism</option>
                <option value="Muslim">Muslim</option>
                <option value="Bhudism">Bhudism</option>
                <option value="Sikhism">Sikhism</option>
                <option value="Others">Others</option>
            </select>
            <br>
            <br>
            </div>
        </div>
        <div>
            <label for="feedback">Feedback:</label>
            <br>
            <textarea name="feedback" id="feedback" cols="30" rows="6" placeholder="Give feedback"></textarea>
        </div>
        <br>
        <div>
            <input type="submit" value="submit"> <!--instead of this you can use button tag-->
            <input type="reset" value="reset">
        </div>
    </form>
</fieldset>
</body>
</html>
