<!DOCTYPE html>
<html lang="en">
<head>

    <title>Media</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <h1>Different categories of videos</h1>
    <span id="animal">
        <h2>Animal</h2>
        <video src="animal.mp4" controls loop height="200" ></video>
    </span>
    <span id="sports">
        <h2>Sports</h2>
        <video src="sports.mp4" controls loop height="200"></video>
    </span>
    <span id="dance">
        <h2>Dance</h2>
        <video src="dance.mp4" controls loop height="200"></video>
    </span>
    <span id="education">
        <h2>Education</h2>
        <video src="education.mp4" controls loop height="200"></video>
    </span>
    <h1>Different categories of audios</h1>
    <span>
        <h2>Gun</h2>
        <audio src="gun.mp3" controls></audio>
    </span>
        <h2>vehicle</h2>
        <audio src="vehicle.mp3" controls></audio>
    </span>
    <span>
        <h2>Nature</h2>
        <audio src="nature.mp3" controls></audio>
    </span>
    <span>
        <h2>Instrument</h2>
        <audio src="instrument.wav" controls></audio>
    </span>

</html>
