<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="msg-container msgContainer">
        <p id="msg"></p>
        <button class="new-btn btn">New Game</button>
    </div>
    <h1>Tic Tac Toe</h1>
    <div id="boxes">
        <div class="row1 row">
            <button class="box box1"></button>
            <button class="box box2"></button>
            <button class="box box3"></button>
        </div>
        <div class="row2 row">
            <button class="box box4"></button>
            <button class="box box5"></button>
            <button class="box box6"></button>
        </div>
        <div class="row3 row">
            <button class="box box7"></button>
            <button class="box box8"></button>
            <button class="box box9"></button>
        </div>
    </div>
    <button class="reset-btn btn">Reset Game</button>
<script src="script.js"></script>
</body>
</html>
