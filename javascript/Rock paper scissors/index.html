<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="heading">
        <h1>Rock Paper Scissors</h1>
    </div>
    <div class="container">
        <div class="circle", id="rock">
          <i class="fa-regular fa-hand-back-fist"></i>
        </div>

        <div class="circle", id="paper">
          <i class="fa-regular fa-hand"></i>
        </div>

        <div class="circle", id="scissor">
          <i class="fa-regular fa-hand-scissors"></i>
        </div>

    </div>
    <div class="score">
        <div class="yourScore">
            <div class="your-num-score num-score">0</div>
            <div>You</div>
        </div>
        <div class="compScore">
            <div class="comp-num-score num-score">0</div>
            <div>Comp</div>
        </div>
    </div>
    <div class="win-msg">Choose</div>
    <button class="restart-btn"></button>
<script src="script.js"></script>
</body>
</html>
